<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#121310">
  <title>Serdar Gündoğdu — Choose language</title>
  <link rel="alternate" hreflang="en" href="https://aserdargun.com/en/">
  <link rel="alternate" hreflang="tr" href="https://aserdargun.com/tr/">
  <link rel="alternate" hreflang="x-default" href="https://aserdargun.com/">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <style>
    :root { color-scheme: dark; font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #121310; color: #fffdf7; }
    main { width: min(680px, calc(100% - 40px)); border: 1px solid rgba(255,255,255,.18); padding: clamp(32px, 7vw, 72px); }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; margin-bottom: 52px; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; color: #c8ff36; font: 700 .72rem "SFMono-Regular", Consolas, monospace; }
    p { margin: 0 0 14px; color: rgba(255,253,247,.68); line-height: 1.6; }
    h1 { max-width: 540px; margin: 0 0 36px; font-size: clamp(2.7rem, 8vw, 5rem); font-weight: 520; letter-spacing: -.06em; line-height: .95; }
    nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    a { border: 1px solid rgba(255,255,255,.2); padding: 18px 20px; color: inherit; text-decoration: none; font-weight: 700; }
    a:first-child { background: #c8ff36; color: #121310; }
    a:focus-visible { outline: 3px solid #ff7043; outline-offset: 3px; }
    @media (max-width: 520px) { nav { grid-template-columns: 1fr; } }
  </style>
  <script>
    (() => {
      const storageKey = "portfolio-language";
      let storedLanguage = null;
      try { storedLanguage = localStorage.getItem(storageKey); } catch {}
      const language = storedLanguage === "tr" || storedLanguage === "en"
        ? storedLanguage
        : (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
      window.location.replace(`/${language}/${window.location.hash || ""}`);
    })();
  </script>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">SG</span>
    <p>Choose your language · Dilinizi seçin</p>
    <h1>Industrial intelligence, built for the real world.</h1>
    <nav aria-label="Language selection · Dil seçimi">
      <a href="/tr/" lang="tr">Türkçe</a>
      <a href="/en/" lang="en">English</a>
    </nav>
  </main>
</body>
</html>
